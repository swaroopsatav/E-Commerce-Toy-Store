{% extends "users/base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
    <h1>Change Password</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_table }}
        <button type="submit" class="btn">Change Password</button>
    </form>
{% endblock %}

{% block extra_css %}
<style>
    body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(to right, #6a11cb, #2575fc);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #fff;
    }

    h1 {
        text-align: center;
        font-size: 2rem;
        margin-bottom: 20px;
        color: #fff;
    }

    form {
        background: rgba(255, 255, 255, 0.1);
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }

    table {
        width: 100%;
        margin-bottom: 15px;
    }

    table td {
        padding: 10px 0;
        color: #fff;
    }

    .btn {
        display: inline-block;
        width: auto;
        padding: 12px 30px;
        background: #ff7b00;
        color: #fff;
        border: none;
        border-radius: 50px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        text-transform: capitalize;
        transition: all 0.3s ease-in-out;
    }

    .btn:hover {
        background: #ff5400;
        transform: translateY(-3px);
    }

    input {
        width: 100%;
        border: none;
        border-radius: 4px;
        padding: 10px;
        margin: 5px 0 15px;
        font-size: 14px;
        color: #333;
    }

    input:focus {
        outline: none;
        border: 2px solid #ff7b00;
    }
</style>
{% endblock %}
