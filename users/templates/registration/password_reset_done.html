{% extends "users/base.html" %}
{% load static %}

{% block title %}Password Reset Sent{% endblock %}

{% block content %}
    <div class="container">
        <h1>Password Reset Sent</h1>
        <p>An email has been sent to you with further instructions.</p>
        <a href="{% url 'login' %}">Back to Login</a>
    </div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'users/css/password_reset_done.css' %}">

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #e9ecef;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background: #f8f9fa;
        padding: 25px 35px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        text-align: center;
        max-width: 420px;
    }

    h1 {
        color: #212529;
        font-size: 26px;
        margin-bottom: 20px;
    }

    p {
        color: #6c757d;
        font-size: 17px;
        margin-bottom: 25px;
    }

    a {
        display: inline-block;
        text-decoration: none;
        color: #ffffff;
        background-color: #17a2b8;
        padding: 12px 25px;
        border-radius: 5px;
        font-size: 15px;
    }

    a:hover {
        background-color: #138496;
    }
</style>
{% endblock %}
