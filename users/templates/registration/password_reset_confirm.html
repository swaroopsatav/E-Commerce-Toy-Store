{% extends "users/base.html" %}
{% load static %}

{% block title %}Set New Password{% endblock %}

{% block content %}
    <div class="container">
        <h1>Set a New Password</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Change Password</button>
        </form>
    </div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'users/css/password_reset_confirm.css' %}">

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #edf2f7;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .container {
        background: #fff;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
        width: 100%;
        max-width: 380px;
        box-sizing: border-box;
        text-align: center;
    }

    h1 {
        color: #2d3748;
        font-size: 24px;
        margin-bottom: 20px;
    }

    form p {
        font-size: 14px;
        color: #4a5568;
        margin-bottom: 15px;
    }

    form input[type="password"], form button {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        font-size: 15px;
        box-sizing: border-box;
    }

    form input[type="password"]:focus {
        outline: none;
        border-color: #3182ce;
        box-shadow: 0 0 3px rgba(49, 130, 206, 0.8);
    }

    form button {
        background: #2b6cb0;
        color: #fff;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease-in-out;
    }

    form button:hover {
        background: #2c5282;
        transform: scale(1.02);
    }

    form button:active {
        transform: scale(0.98);
    }
</style>
{% endblock %}
