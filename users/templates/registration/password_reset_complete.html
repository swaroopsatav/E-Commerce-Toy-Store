{% extends 'users/base.html' %}
{% load static %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
    <div class="container">
        <h1>Password Reset Complete</h1>
        <p>Your password has been successfully reset. You can now <a href="{% url 'login' %}">log in</a>.</p>
    </div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'users/css/password_reset_complete.css' %}">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(135deg, #74ebd5, #acb6e5);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        background-color: #ffffff;
        border: none;
        border-radius: 16px;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
        padding: 40px 50px;
        width: 90%;
        max-width: 420px;
        text-align: center;
    }

    h1 {
        font-size: 32px;
        color: #34495e;
        margin-bottom: 20px;
        font-weight: 700;
    }

    p {
        font-size: 18px;
        color: #7f8c8d;
        margin-bottom: 30px;
        line-height: 1.6;
    }

    a {
        color: #ffffff;
        background-color: #3498db;
        text-decoration: none;
        font-weight: 600;
        padding: 12px 24px;
        border: none;
        border-radius: 25px;
        display: inline-block;
        transition: background-color 0.3s ease, transform 0.3s ease;
    }

    a:hover {
        background-color: #2980b9;
        transform: scale(1.05);
    }
</style>
{% endblock %}
