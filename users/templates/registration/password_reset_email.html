{% autoescape off %}
<div style="max-width: 600px; margin: auto; background: #ffffff; border-radius: 10px; padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); font-family: Arial, sans-serif; color: #333;">

    <div style="text-align: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-bottom: 15px;">
        <h2 style="color: #34495e;">Password Reset Requested</h2>
    </div>

    <p>Hi {{ user.get_username }},</p>

    <p>We received a request to reset your password. Click the button below to reset it:</p>

    <p style="text-align: center;">
        <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
           style="display: inline-block; padding: 12px 20px; color: #fff; background-color: #3498db;
                  text-decoration: none; font-size: 16px; font-weight: bold; border-radius: 5px;
                  transition: background-color 0.3s ease;">
            Reset Password
        </a>
    </p>

    <p>If you did not request this, please ignore this email.</p>

    <p style="color: #95a5a6; text-align: center; font-size: 14px;">Thank you,<br>The Team</p>
</div>
{% endautoescape %}
