<!DOCTYPE html>
{% extends 'shipping/base.html' %}
<html lang="en">
<head>
    <title>Edit Address</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 600px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #343a40;
        }

        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }

        .btn-secondary {
            margin-left: 10px;
            color: #fff;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h1>Edit Address</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="full_name" class="form-label">Full Name</label>
            <input type="text" name="full_name" id="full_name" class="form-control" value="{{ address.full_name }}"
                   required>
        </div>
        <div class="mb-3">
            <label for="street_address" class="form-label">Street Address</label>
            <textarea name="street_address" id="street_address" class="form-control" rows="3"
                      required>{{ address.street_address }}</textarea>
        </div>
        <div class="mb-3">
            <label for="city" class="form-label">City</label>
            <input type="text" name="city" id="city" class="form-control" value="{{ address.city }}" required>
        </div>
        <div class="mb-3">
            <label for="state" class="form-label">State</label>
            <input type="text" name="state" id="state" class="form-control" value="{{ address.state }}" required>
        </div>
        <div class="mb-3">
            <label for="postcode" class="form-label">Postcode</label>
            <input type="text" name="postcode" id="postcode" class="form-control" value="{{ address.postcode }}"
                   required>
        </div>
        <div class="mb-3">
            <label for="country" class="form-label">Country</label>
            <input type="text" name="country" id="country" class="form-control" value="{{ address.country }}" required>
        </div>
        <div class="mb-3">
            <label for="phone_number" class="form-label">Phone Number</label>
            {% if form.phone_number.errors %}
                <ul class="errorlist">
                    {% for error in form.phone_number.errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
            <input type="text" name="phone_number" id="phone_number" class="form-control"
                   value="{{ address.phone_number }}">
        </div>
        <button type="submit" class="btn btn-success">Update Address</button>
        <a href="{% url 'shipping:address_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
