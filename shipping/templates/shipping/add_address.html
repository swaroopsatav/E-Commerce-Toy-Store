<!DOCTYPE html>
{% extends 'shipping/base.html' %}
<html lang="en">
<head>
    <title>Add New Address</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        h1 {
            color: #343a40;
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 600px;
        }

        label {
            font-weight: bold;
            color: #495057;
        }

        button {
            width: 100%;
        }

        .btn-secondary {
            width: auto;
            display: block;
            margin: 10px auto 0;
            text-align: center;
        }

        .errorlist {
            color: red;
            font-size: 0.9rem;
            margin-top: -10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h1>Add a New Address</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="full_name" class="form-label">Full Name</label>
            <input type="text" name="full_name" id="full_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="street_address" class="form-label">Street Address</label>
            <textarea name="street_address" id="street_address" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="city" class="form-label">City</label>
            <input type="text" name="city" id="city" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="state" class="form-label">State</label>
            <input type="text" name="state" id="state" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="postcode" class="form-label">Postcode</label>
            <input type="text" name="postcode" id="postcode" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="country" class="form-label">Country</label>
            <input type="text" name="country" id="country" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="phone_number" class="form-label">Phone Number</label>
            <input type="text" name="phone_number" id="phone_number" class="form-control" required>
            <ul class="errorlist">
                <li>phone_number
                    <ul class="errorlist">
                        <li>Enter a whole number.</li>
                    </ul>
                </li>
            </ul>
        </div>
        <button type="submit" class="btn btn-success">Save Address</button>
        <a href="{% url 'shipping:address_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
