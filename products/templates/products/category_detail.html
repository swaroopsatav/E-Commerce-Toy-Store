{% extends 'products/base.html' %}

{% block title %}{{ category.name|default:"Category" }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="text-center">
        <h2 class="mb-4">{{ category.name|default:"Category" }}</h2>
    </div>

    <!-- Check if images exist -->
    {% if category.images.all %}
        <div class="mt-3">
            <h4>Images:</h4>
            <div class="row">
                {% for image in category.images.all %}
                    <div class="col-md-3 col-sm-6 mb-4">
                        <div class="card shadow-sm border-0">
                            <img src="{{ image.image.url }}" alt="{{ category.name }}" class="card-img-top rounded"
                                 style="object-fit: contain; height: 200px; width: 100%;">
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    {% else %}
        <!-- Default Image Instead of Alert -->
        <div class="d-flex justify-content-center mt-4">
            <img src="/static/images/default-category.jpg" alt="No Image Available"
                 style="height: 250px; width: auto; object-fit: contain;">
        </div>
    {% endif %}
</div>
{% endblock %}
