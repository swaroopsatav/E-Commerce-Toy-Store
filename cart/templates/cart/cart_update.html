{% extends 'cart/base.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Update Cart - Toy Store{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <style>
        h1 {
            font-family: 'Arial', sans-serif;
            font-size: 2.5rem;
            color: #333;
        }

        .container {
            max-width: 600px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-label {
            font-weight: bold;
            color: #555;
        }

        .form-control {
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }

        .btn-secondary {
            margin-top: 20px;
            background-color: #6c757d;
            border-color: #6c757d;
        }

        .mb-3 {
            margin-bottom: 1.5rem !important;
        }
    </style>
</head>
<body>

{% block content %}
<div class="container mt-4">
    <h1>Update Cart</h1>
    <form method="post" action="{% url 'cart:update_cart' %}">
        {% csrf_token %}
        {% if cart.items %}
            {% for item in cart.items %}
                <div class="mb-3">
                    <label for="quantity_{{ item.product.id }}" class="form-label">{{ item.product.name }}</label>
                    <input type="number" name="quantity_{{ item.product.id }}" id="quantity_{{ item.product.id }}"
                           value="{{ item.quantity }}" class="form-control" style="width: 120px;" min="1">
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Update Cart</button>
        {% else %}
            <p>Your cart is empty! <a href="{% url 'products:product_list' %}">Continue shopping</a></p>
        {% endif %}
    </form>
    <a href="{% url 'cart:cart' %}" class="btn btn-secondary mt-3">Back to Cart</a>
</div>
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
