{% extends 'cart/base.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Empty Cart - Toy Store{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            font-size: 2.5rem;
            color: #343a40;
        }

        p {
            font-size: 1.2rem;
            color: #6c757d;
        }

        a.btn-primary {
            font-size: 1rem;
            padding: 10px 20px;
        }
    </style>
</head>
<body>

{% block content %}
    <div class="container mt-4 text-center">
        <h1>Your Cart is Empty</h1>
        <p>It looks like you haven’t added anything to your cart yet.</p>
        <a href="{% url 'products:product_list' %}" class="btn btn-primary">Browse Products</a>
    </div>
{% endblock %}

</body>
</html>
