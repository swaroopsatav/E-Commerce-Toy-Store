<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .export-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
            border: 1px solid #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
            border: 1px solid #28a745;
        }

        .btn-success:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }
    </style>
</head>
<body>
{% extends "admin/change_list.html" %}

{% block content %}
    <div class="object-tools">
        {% if cl.show_export_buttons %}
            <div class="export-buttons">
                <a href="?{% if cl.params %}{{ cl.params|urlencode }}&amp;{% endif %}export=csv"
                   class="btn btn-primary">
                    Export as CSV
                </a>
                <a href="?{% if cl.params %}{{ cl.params|urlencode }}&amp;{% endif %}export=xlsx"
                   class="btn btn-success">
                    Export as Excel
                </a>
            </div>
        {% endif %}
    </div>
    {{ block.super }}
{% endblock %}
</body>
</html>
