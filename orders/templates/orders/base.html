<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-commerce Store{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f8f9fa; /* Light background for the whole page */
            font-family: Arial, sans-serif; /* Set a clean font */
            color: #333; /* Adjust default text color */
        }

        .container {
            flex: 1;
        }

        .navbar {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Add shadow to the navbar */
        }

        .navbar-brand {
            color: #007bff !important; /* Brand color */
            font-weight: bold; /* Make the brand bolder */
        }

        .nav-link {
            margin-right: 10px;
            color: #333 !important; /* Adjust nav link color */
        }

        .nav-link:hover {
            color: #007bff !important; /* Hover effect for nav links */
        }

        .footer {
            background-color: #e9ecef; /* Slightly darker background for footer */
            font-size: 0.9em; /* Smaller footer text */
        }

        footer p {
            margin: 0;
        }

        .container.mt-4 {
            padding: 20px; /* Add some spacing */
            background: #fff; /* White background for content */
            border-radius: 8px; /* Rounded corners */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Add shadow */
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="{% url 'products:home_view' %}">ToyStore</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'products:home_view' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'orders:order_history' %}">My Orders</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'users:login' %}">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-4">
    {% block content %}
        <p>{{ order.id }}</p>
    {% endblock %}
</div>

<!-- Footer -->
<footer class="footer py-4 mt-auto">
    <div class="container text-center">
        <p>&copy; 2025 ToyStore. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.min.js"></script>
</body>
</html>
