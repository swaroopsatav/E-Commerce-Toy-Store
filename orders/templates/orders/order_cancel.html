<!DOCTYPE html>
{% extends 'orders/base.html' %}
<html lang="en">
<head>
    <title>Cancel Order</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #dc3545;
            font-size: 2.5rem;
        }

        .form-control {
            border-radius: 5px;
            border: 1px solid #ced4da;
        }

        .btn-danger {
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
        }

        .btn-secondary {
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
        }

        p {
            font-size: 1.1rem;
            color: #495057;
        }

        .container {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            margin-top: 50px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
<div class="container mt-4 text-center">
    <h1>Cancel Order</h1>
    <p>Are you sure you want to cancel order <strong>#{{ order.id }}</strong>?</p>
    <p>
        <strong>Order Total:</strong> ${{ order.total_price }}<br>
        <strong>Status:</strong> {{ order.status }}
    </p>
    <form method="post">
        {% csrf_token %}
        <textarea name="cancellation_reason" class="form-control mb-3" rows="3"
                  placeholder="Reason for cancellation (optional)"></textarea>
        <button type="submit" class="btn btn-danger">Yes, Cancel Order</button>
        <a href="{% url 'order_detail' order.id %}" class="btn btn-secondary">No, Go Back</a>
    </form>
</div>
</body>
</html>
