<!DOCTYPE html>
{% extends 'payment/base.html' %}
<html lang="en">
<head>
    <title>Select Payment Method</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #343a40;
        }

        .form-check-label {
            font-size: 1.1rem;
        }

        .btn-primary {
            display: block;
            width: 100%;
            padding: 10px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h1>Select Payment Method</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-check mb-3">
            <input type="radio" name="payment_method" id="credit_card" value="credit_card" class="form-check-input"
                   required>
            <label for="credit_card" class="form-check-label">Credit/Debit Card</label>
        </div>
        <div class="form-check mb-3">
            <input type="radio" name="payment_method" id="paypal" value="paypal" class="form-check-input">
            <label for="paypal" class="form-check-label">PayPal</label>
        </div>
        <div class="form-check mb-3">
            <input type="radio" name="payment_method" id="cash_on_delivery" value="cash_on_delivery"
                   class="form-check-input">
            <label for="cash_on_delivery" class="form-check-label">Cash on Delivery</label>
        </div>
        <button type="submit" class="btn btn-primary">Proceed</button>
    </form>
</div>
</body>
</html>
