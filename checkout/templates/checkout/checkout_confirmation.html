<!DOCTYPE html>
{% extends 'checkout/base.html' %}
<html lang="en">
<head>
    <title>Order Confirmation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .container {
            padding: 50px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #343a40;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }

        p {
            color: #495057;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            font-size: 1rem;
            padding: 10px 20px;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="container mt-4 text-center">
    <h1>Thank You for Your Order!</h1>
    <p>Your order has been placed successfully. Your order number is <strong>#{{ order.id }}</strong></p>
    <p>An email confirmation has been sent to {{ user.email }}</p>
    <a href="{% url 'orders:order_history' %}" class="btn btn-primary">View Orders</a>
</div>
</body>
</html>
